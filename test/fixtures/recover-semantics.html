<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>恢复语义夹具</title>
</head>
<body>
  <table>
    <tbody>
      <tr><td>姓名*</td><td><input name="xm"></td></tr>
      <tr><td>手机号码*</td><td><input name="sjh"></td></tr>
      <tr><td>电子邮箱*</td><td><input name="email"></td></tr>
    </tbody>
  </table>
  <button id="finalSubmit" type="button">保存并提交</button>
  <script>
    // F07 夹具行为:
    // - xm:写入后 250ms 被页面脚本改成"第三方修改"(既非写前值也非写入值)→ 来源不明,扩展不得自动恢复。
    // - sjh:写入后 250ms 被清空(回到写前空值)→ 属"已回到原值"的可恢复判定。
    // - email:正常保持 → 对照组。
    // 提交按钮用于验证恢复过程绝不触发业务提交。
    window.__submitClicked = 0;
    document.getElementById('finalSubmit').addEventListener('click', function () { window.__submitClicked += 1; });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var name = t.getAttribute('name');
      if (name === 'xm') {
        setTimeout(function () { t.value = '第三方修改'; }, 250);
      } else if (name === 'sjh') {
        setTimeout(function () { t.value = ''; }, 250);
      }
    }, true);
  </script>
</body>
</html>
